name: Sync IPTV mirror and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: iptv-mirror-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/vbskycn/iptv.git
          git fetch --prune upstream master

      - name: Check upstream revision
        id: upstream
        shell: bash
        run: |
          upstream_sha="$(git rev-parse upstream/master)"
          previous_sha="$(cat .upstream-sha 2>/dev/null || true)"
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if [ "$upstream_sha" = "$previous_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh mirror from upstream
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          cp -a .github/workflows "$RUNNER_TEMP/workflows"
          git reset --hard upstream/master
          rm -rf .github/workflows
          mkdir -p .github
          cp -a "$RUNNER_TEMP/workflows" .github/workflows

          python3 <<'PY'
          import os, re
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          owner, name = repo.split('/', 1)
          page_base = f"https://{owner}.github.io/{name}"

          cfg = Path('_config.yml')
          if cfg.exists():
              s = cfg.read_text(encoding='utf-8')
              s = re.sub(r'^url:\s*.*$', f'url: https://{owner}.github.io', s, flags=re.M)
              if re.search(r'^baseurl:\s*', s, flags=re.M):
                  s = re.sub(r'^baseurl:\s*.*$', f'baseurl: /{name}', s, flags=re.M)
              else:
                  s = re.sub(r'(^url:\s*.*$)', r'\1\nbaseurl: /' + name, s, count=1, flags=re.M)
              s = re.sub(r'^author:\s*.*$', f'author: {owner}', s, flags=re.M)
              s = re.sub(r'^google_adsense:\s*.*$', 'google_adsense:', s, flags=re.M)
              s = s.replace('github: vbskycn/iptv', f'github: {repo}')
              s = s.replace('https://github.com/vbskycn/iptv\n', f'https://github.com/{repo}\n    - https://github.com/vbskycn/iptv\n', 1)
              s = re.sub(r'^\s*telegram:\s*starkluistn98\s*$', '  telegram:', s, flags=re.M)
              cfg.write_text(s, encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              s = readme.read_text(encoding='utf-8')
              s = s.replace('https://live.zbds.top/tv/', page_base + '/tv/')
              s = s.replace('https://live.zbds.top/', page_base + '/')
              s = s.replace('raw.githubusercontent.com/vbskycn/iptv/refs/heads/master/tv/',
                            f'raw.githubusercontent.com/{repo}/refs/heads/master/tv/')
              if 'Mirror maintained by ' + owner not in s:
                  s = s.replace('---\n\n\n<h2',
                                f'---\n\n> **Mirror maintained by {owner}.** Upstream project: [vbskycn/iptv](https://github.com/vbskycn/iptv). Channel data is synchronized automatically every 6 hours; upstream attribution and license remain intact.\n\n<h2',
                                1)
              readme.write_text(s, encoding='utf-8')

          layout = Path('_layouts/default.html')
          if layout.exists():
              s = layout.read_text(encoding='utf-8')
              s = s.replace("site.author | default: 'vbskycn'", f"site.author | default: '{owner}'")
              s = re.sub(r'<p class="copyright">.*?</p>',
                         f'<p class="copyright">\n            © 2026 <a href="{page_base}">{owner} IPTV mirror</a> · Upstream <a href="https://github.com/vbskycn/iptv" target="_blank">vbskycn/iptv</a>\n          </p>',
                         s, flags=re.S)
              s = re.sub(r'\s*<link rel="dns-prefetch" href="//pagead2\.googlesyndication\.com">\s*', '\n', s)
              s = re.sub(r'\s*<link rel="dns-prefetch" href="//sdk\.51\.la">\s*', '\n', s)
              s = re.sub(r'\n\s*<!-- 51\.la 统计代码 - 异步安装 -->.*?</script>\s*(?=</body>)', '\n', s, flags=re.S)
              layout.write_text(s, encoding='utf-8')
          PY

          printf '%s\n' "$UPSTREAM_SHA" > .upstream-sha
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream ${UPSTREAM_SHA:0:12}"
            git push origin HEAD:master --force-with-lease
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Deploy GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: 'docs: deploy synchronized IPTV mirror'

      - name: Summary
        run: |
          echo "## IPTV mirror" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: vbskycn/iptv@${{ steps.upstream.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed: ${{ steps.upstream.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages branch: gh" >> "$GITHUB_STEP_SUMMARY"
